<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>KuruBets</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      max-height: 560px;

      margin: 0;
      padding: 14px;

      background: #111827;
      color: #f1f5f9;

      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    h3 {
      margin: 0;
      font-size: 17px;
    }

    .sub {
      margin-top: 3px;
      margin-bottom: 14px;
      color: #9ca3af;
      font-size: 12px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    button {
      width: 100%;

      padding: 10px 12px;

      border: 1px solid #3b4759;
      border-radius: 9px;

      background: #1b2533;
      color: #fff;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #26344a;
    }

    button.primary {
      border-color: transparent;
      background: #ff7a45;
      color: #1a0d05;
    }

    button.primary:hover {
      background: #ff8958;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #status {
      min-height: 18px;
      margin: 10px 0;
      color: #9ca3af;
      line-height: 1.4;
    }

    .ok {
      color: #64d48b !important;
    }

    .error {
      color: #ff7474 !important;
    }

    #list {
      max-height: 350px;
      overflow-y: auto;
    }

    .bet {
      margin-bottom: 7px;
      padding: 9px;

      border: 1px solid #293548;
      border-radius: 9px;

      background: #172131;
    }

    .bet:last-child {
      margin-bottom: 0;
    }

    .match {
      margin-bottom: 5px;
      font-weight: 700;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      padding: 2px 0;
    }

    .line span {
      color: #9ca3af;
    }

    .empty {
      padding: 16px 5px;
      text-align: center;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <h3>KuruBets</h3>

  <div class="sub">
    Импорт ставок из BetBoom
  </div>

  <div class="buttons">
    <button id="scanBtn">
      Проверить ставки
    </button>

    <button
      id="importBtn"
      class="primary"
      disabled
    >
      Добавить в KuruBets
    </button>
  </div>

  <div id="status"></div>

  <div id="list">
    <div class="empty">
      Нажми «Проверить ставки»
    </div>
  </div>

  <script src="popup.js"></script>

</body>

</html>
